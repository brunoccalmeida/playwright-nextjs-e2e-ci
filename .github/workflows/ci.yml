name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: jobs that need more ask for it explicitly
permissions:
  contents: read

# A new push to a PR supersedes the run of the previous commit; on main a
# running run is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the exact version from "packageManager" in package.json.
      # Before setup-node, whose pnpm cache needs the pnpm binary.
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      # Same Node as local development: one source of truth (.node-version)
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      # Fails if pnpm-lock.yaml and package.json disagree
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check, lint, format check and sentinels
        run: pnpm check

  # Production dependencies only, from high severity up: what ships to users.
  # Accepted exceptions live in audit.ignore (pnpm-workspace.yaml), per GHSA.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      # Reads pnpm-lock.yaml, so no install is needed
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Lists the commits of the PR to scan
      pull-requests: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The scan covers the commit range of the PR or push, and it needs
          # the parent of the first commit, which a shallow clone does not have
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Comments would need pull-requests: write; the failed job is enough
          GITLEAKS_ENABLE_COMMENTS: false

  workflow-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit workflows
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          # Off: SARIF mode never fails the job, and exit codes are the gate
          advanced-security: false
          # "latest" would let a new audit fail unrelated PRs
          version: 1.32.0

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      # Noble, as glibc is required. The tag must match @playwright/test, or the
      # browsers are not found (pnpm check:ci-image reports the image to use).
      # The digest pins the content, a tag can move.
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe
      # 1001 owns the mounted workspace. --init reaps zombie processes and
      # --ipc=host keeps Chromium from running out of shared memory.
      options: --user 1001 --init --ipc=host
    services:
      postgres:
        # Same major as compose.yaml; a new database for every job
        image: postgres:18@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        env:
          POSTGRES_USER: payload
          POSTGRES_PASSWORD: payload
          POSTGRES_DB: payload
        # -h forces TCP, see compose.yaml. The job only starts once it is healthy.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U payload -d payload"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      # The job runs in a container, so the service is reached by its label
      DATABASE_URL: postgresql://payload:payload@postgres:5432/payload
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      # The demo author from the template's public seed, in a disposable database
      E2E_ADMIN_EMAIL: demo-author@example.com
      E2E_ADMIN_PASSWORD: password
    outputs:
      pages-artifact: ${{ steps.pages-artifact.outcome }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # New values on every run. The published report records requests, so a
      # token that ends up there must not open anything after this job.
      - name: Generate disposable secrets
        run: |
          for name in PAYLOAD_SECRET CRON_SECRET PREVIEW_SECRET; do
            value="$(node -p "require('node:crypto').randomBytes(32).toString('hex')")"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done

      - name: Run migrations
        run: pnpm db:migrate

      # Before the build, so static pages are generated with content
      - name: Seed the database
        run: pnpm db:seed

      - name: Build the app
        run: pnpm build

      # Playwright's webServer starts "pnpm start" and prints its log here
      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Upload report on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      # Also after a failed run: that is when the report matters most
      - name: Package report for GitHub Pages
        id: pages-artifact
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && hashFiles('playwright-report/index.html') != '' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: playwright-report/

  # Outside the ci-passed gate: it only runs on main, after the merge.
  publish-report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [e2e]
    if: ${{ !cancelled() && needs.e2e.outputs.pages-artifact == 'success' }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # The single required check of the ruleset on main. Requiring each job by
  # name would mean editing the ruleset whenever a job is added or renamed;
  # this job's name never changes. always(): a required check that is skipped
  # counts as passed, so the gate must run, and fail, when a dependency fails
  # or is cancelled.
  ci-passed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [check, audit, secret-scan, workflow-audit, e2e]
    if: ${{ always() }}

    steps:
      # Allowlist: only an explicit "success" passes; failure, cancelled and
      # skipped all fail, because a skipped job tested nothing.
      - name: Require every job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e 'length > 0 and all(.[]; .result == "success")' <<< "$NEEDS" > /dev/null
