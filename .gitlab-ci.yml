# The e2e job of .github/workflows/ci.yml, run on a GitLab.com mirror to prove
# the suite is portable. GitHub stays the source of truth and runs every other
# gate. The mirror is updated by hand, because pull mirroring needs a paid tier.
e2e:
  # Same image and digest as the GitHub job. It runs as root, the image default:
  # the app under test is our own, and root is what the Playwright docs accept
  # for trusted sites.
  image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
  services:
    # A new database for every job. The alias is explicit so the hostname does
    # not depend on how the runner derives it from a name with a digest.
    - name: postgres:18@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
      alias: postgres
  timeout: 30 minutes
  variables:
    POSTGRES_USER: payload
    POSTGRES_PASSWORD: payload
    POSTGRES_DB: payload
    DATABASE_URL: postgresql://payload:payload@postgres:5432/payload
    NEXT_PUBLIC_SERVER_URL: http://localhost:3000
    # The demo author from the template's public seed, in a disposable database
    E2E_ADMIN_EMAIL: demo-author@example.com
    E2E_ADMIN_PASSWORD: password
    PNPM_HOME: /root/.local/share/pnpm
  script:
    # The image ships Node 24.20, below the "engines" range of package.json.
    # Versions come from the same files GitHub reads: one source of truth.
    - npm install --global "pnpm@$(node -p "require('./package.json').packageManager.split('@')[1]")"
    - export PATH="$PNPM_HOME/bin:$PATH"
    - pnpm runtime set node "$(cat .node-version)" -g
    # The image's Node would run the whole suite without complaint, so the
    # version is checked instead of assumed
    - test "$(node --version)" = "v$(cat .node-version)"
    - pnpm install --frozen-lockfile
    # New values on every run: a token that ends up in the report must not open
    # anything after this job
    - |
      for name in PAYLOAD_SECRET CRON_SECRET PREVIEW_SECRET; do
        export "$name=$(node -p "require('node:crypto').randomBytes(32).toString('hex')")"
      done
    - pnpm db:migrate
    # Before the build, so static pages are generated with content
    - pnpm db:seed
    - pnpm build
    # Playwright's webServer starts "pnpm start" and prints its log here
    - pnpm test:e2e
  artifacts:
    when: on_failure
    paths:
      - playwright-report/
    expire_in: 30 days
