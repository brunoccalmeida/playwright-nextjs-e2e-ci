# pnpm 11 no longer reads the "pnpm" field of package.json, and an install
# fails on any dependency with an unreviewed build script (strictDepBuilds).
# Same allowlist the template declared there. https://pnpm.io/settings/build
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

# Fail the install when the running Node misses an engines.node range, the
# project's (pinned to the .node-version line) or a dependency's. Without it,
# pnpm only warns, even for the project's own range (the 11.x docs still say
# that one always fails; fixed in the 12.x docs, pnpm/pnpm#17751).
# https://github.com/pnpm/pnpm.io/blob/main/docs/settings/cli.md#enginestrict
engineStrict: true

# monaco-editor pins dompurify exactly, so only an override reaches the patch
# that fixes GHSA-cg2g-xh64-v4q7 and GHSA-mrv2-3pqr-j5jr. Remove it once a
# monaco-editor release depends on >=3.4.17.
overrides:
  dompurify: 3.4.17

# Accepted risks. Each entry expires within 30 days and names its issue, as
# scripts/check-audit-exceptions.ts enforces: on expiry, review the advisory and
# the issue, then renew the date or remove the entry.
audit:
  ignore:
    # happy-dom comes from @lexical/headless (^20.9.0) and the fix only ships in
    # 21, a major we do not force. It is loaded only by the @lexical/headless/dom
    # export, which neither the app nor any Payload package imports, so the
    # vulnerable code is not reachable.
    - GHSA-834v-8h66-3h79 # expires 2026-12-18, #20
    - GHSA-c8p4-j97h-3vg8 # expires 2026-12-18, #20
    # picomatch ReDoS, no patched version published. The attacker must supply
    # the glob pattern; here every pattern comes from project config: tinyglobby
    # in `payload generate:types`, fast-glob in the next-sitemap postbuild, and
    # chokidar only in `sass --watch`, with globbing disabled. Remove it once a
    # fixed picomatch reaches the lockfile.
    - GHSA-fc5q-39xc-vjpf # expires 2026-12-18, #55
